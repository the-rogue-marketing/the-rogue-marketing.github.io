{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}{{ site.baseurl }}/"
    },
    {% if page.categories.size > 0 %}
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.categories[0] | capitalize }}",
      "item": "{{ site.url }}{{ site.baseurl }}/categories/#{{ page.categories[0] | slugify }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }}
    }
    {% else %}
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }}
    }
    {% endif %}
  ]
}
</script>
{% endif %}
